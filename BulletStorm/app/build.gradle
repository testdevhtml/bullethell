plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bulletstorm.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.bulletstorm.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // signé avec la clé de debug pour que l'APK soit directement installable
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
